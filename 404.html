<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Page Not Found</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 {
            font-size: 3em; /* Larger than 404 text */
            color: #d9534f; /* A distinct error color */
            margin-bottom: 0.2em;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 1.5em;
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .error-code {
            font-size: 6em; /* Very large for the 404 */
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 0.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="error-code">404</span>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <p>You can <a href="/">return to the homepage</a> or try searching.</p>
        <!-- Optional: You can add a search box here if your site has search functionality -->
    </div>
</body>
  </html>
